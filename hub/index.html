<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SSM Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout idea: app shell — fixed left sidebar with the four SSM modules, content pane on the right. Each module page lists its tools by customer → project from registry.json. */
:root{
  --bg:#f3f5f7; --paper:#ffffff; --ink:#18212b; --muted:#5d6b7a; --line:#d8dee5;
  --accent:#0b5e8a; --accent-soft:#e3eff6; --good:#1d7a46; --side:#16212c; --side-ink:#c9d4de; --side-active:#ffffff;
  --font-body:"IBM Plex Sans Thai","Leelawadee UI","Tahoma",system-ui,sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#11161c;--paper:#182029;--ink:#e4e9ef;--muted:#93a1b0;--line:#2b3642;--accent:#5fb3e0;--accent-soft:#15303f;--good:#6fd39a;--side:#0b1015;color-scheme:dark}
}
:root[data-theme="dark"]{--bg:#11161c;--paper:#182029;--ink:#e4e9ef;--muted:#93a1b0;--line:#2b3642;--accent:#5fb3e0;--accent-soft:#15303f;--good:#6fd39a;--side:#0b1015;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
code{font-family:var(--font-mono);font-size:.9em}

.shell{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side .brand{padding:20px 20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.side .brand .eyebrow{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:.7}
.side .brand b{display:block;color:#fff;font-size:21px;line-height:1.2;margin-top:2px}
.nav{list-style:none;margin:0;padding:12px 10px;display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:6px;text-decoration:none;font-size:14.5px}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.nav a[aria-current="page"]{background:var(--accent);color:var(--side-active);font-weight:600}
.nav .no{font-family:var(--font-mono);font-size:11px;opacity:.65;width:18px}
.nav .cnt{margin-left:auto;font-family:var(--font-mono);font-size:11px;opacity:.75}
.nav .soon{margin-left:auto;font-size:10.5px;border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:0 7px;opacity:.8}
.side .foot{margin-top:auto;padding:14px 20px;font-size:11.5px;opacity:.6;border-top:1px solid rgba(255,255,255,.08)}

.main{min-width:0}
.content:focus{outline:none}
.topbar{display:none;align-items:center;gap:12px;padding:10px 16px;background:var(--side);color:#fff;position:sticky;top:0;z-index:5}
.topbar button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:5px;padding:4px 10px;font:inherit}
.content{max-width:1100px;margin:0 auto;padding:28px 28px 64px;display:grid;gap:20px}
.page-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:14px}
.page-head .eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.page-head h1{margin:2px 0 0;font-size:28px;line-height:1.2;text-wrap:balance}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:14px;max-width:62ch}
.stats{display:flex;gap:22px;font-variant-numeric:tabular-nums}
.stats div{display:grid}
.stats b{font-size:22px;line-height:1.1}
.stats span{font-size:12px;color:var(--muted)}
.search{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:10px 12px;font:inherit;color:inherit}

.modules{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.mod{display:grid;gap:4px;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.mod:hover{border-color:var(--accent)}
.mod .m-no{font-family:var(--font-mono);font-size:11px;color:var(--muted)}
.mod .m-name{font-weight:600;font-size:16px}
.mod .m-desc{font-size:13px;color:var(--muted)}
.mod .m-state{font-size:12px;font-family:var(--font-mono);color:var(--accent)}
.mod .m-state.soon{color:var(--muted)}

h2.sec{font-size:15px;margin:6px 0 0;color:var(--muted);font-weight:600;letter-spacing:.02em}
.customer{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.c-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;padding:13px 18px;border-bottom:1px solid var(--line)}
.c-head h3{margin:0;font-size:18px}
.c-head .meta{color:var(--muted);font-size:13px}
.lvl{font-family:var(--font-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.project{display:grid;grid-template-columns:minmax(190px,260px) 1fr;gap:16px;padding:16px 18px;border-top:1px solid var(--line)}
.c-head + .project{border-top:0}
.p-info .jo{font-family:var(--font-mono);font-size:13px;color:var(--accent);font-weight:500}
.p-info h4{margin:2px 0 6px;font-size:15px;line-height:1.35}
.p-info .row{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:999px;padding:0 8px}
.pill.status{border-color:var(--good);color:var(--good)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;align-content:start}
.tool{display:grid;gap:3px;text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:11px 13px;background:var(--bg)}
.tool:hover{border-color:var(--accent);background:var(--accent-soft)}
.tool .t-mod{font-family:var(--font-mono);font-size:11px;color:var(--accent)}
.tool .t-name{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.tool .t-name::after{content:"→";color:var(--accent)}
.tool .t-desc{font-size:12.5px;color:var(--muted);line-height:1.45}

.tbl{background:var(--paper);border:1px solid var(--line);border-radius:8px;overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
tr:last-child td{border-bottom:0}
td .jo{font-family:var(--font-mono);color:var(--accent)}
td a.open{display:inline-block;text-decoration:none;border:1px solid var(--accent);color:var(--accent);border-radius:5px;padding:3px 12px;font-size:13px;font-weight:600;white-space:nowrap}
td a.open:hover{background:var(--accent);color:#fff}

.placeholder{background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:28px;display:grid;gap:10px}
.placeholder h3{margin:0;font-size:17px}
.placeholder ul{margin:0;padding-left:20px;color:var(--muted);font-size:14px}
.placeholder .tag{justify-self:start;font-family:var(--font-mono);font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 10px}
.empty{color:var(--muted);padding:20px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.note{font-size:12px;color:var(--muted)}

@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:250px;z-index:10;transform:translateX(-100%);transition:transform .2s}
  .shell.open .side{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex}
  .content{padding:20px 16px 48px}
  .project{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){.side{transition:none}}
</style>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" aria-label="เมนูหลัก">
    <div class="brand"><span class="eyebrow">RAK Engineering · SSM</span><b>SSM Work</b></div>
    <ul class="nav" id="nav"></ul>
    <div class="foot" id="sideFoot"></div>
  </aside>
  <div class="main">
    <div class="topbar"><button id="menuBtn" aria-controls="nav" aria-expanded="false">☰ เมนู</button><b>SSM Work</b></div>
    <main class="content" id="content" tabindex="-1"></main>
  </div>
</div>
<script>
"use strict";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Menu. Add a module here, then tag its tools in registry.json with "module": "<id>". */
const MODULES = [
  {id:"home",        no:"01", name:"Home",        th:"ภาพรวม",               desc:"ลูกค้า โปรเจค และเครื่องมือทั้งหมดของ SSM"},
  {id:"site-expense",no:"02", name:"Site Expense",th:"ประเมินค่าใช้จ่ายหน้างาน", desc:"ประเมิน manday และค่าใช้จ่ายติดตั้ง พร้อมขั้นตอนอนุมัติ SC → SSM → MD",
     plan:["ประเมิน manday และค่าใช้จ่ายรายโปรเจค","Master rate (คน รถ ที่พัก เบี้ยเลี้ยง)","ขั้นตอนอนุมัติ SC → SSM → MD","เทียบงบกับค่าใช้จ่ายจริง"]},
  {id:"spare-part",  no:"03", name:"Spare Part",  th:"รายการอะไหล่แนะนำ",       desc:"รายการอะไหล่แนะนำให้ลูกค้า แยกตามระบบ อ้างอิง P&ID และ Aux list",
     plan:["สร้างรายการอะไหล่จาก P&ID + Aux list + BOM","จุดใช้งานตาม P&ID และข้อมูลผู้ผลิต","Export Excel ตามแบบฟอร์มลูกค้า"]},
  {id:"punch-list",  no:"04", name:"Punch List",  th:"ติดตามงานค้างก่อนส่งมอบ",   desc:"บันทึกและติดตาม punch list ระหว่างติดตั้ง จนถึง SAT และปิดงาน",
     plan:["บันทึกรายการพร้อมรูปถ่ายและผู้รับผิดชอบ","สถานะ Open / In progress / Closed","รายงานให้ลูกค้าก่อน SAT","สรุปจำนวนงานค้างรายโปรเจค"]},
];
let REG = {customers:[]};

/* flatten registry into tool rows */
function rows(){
  const out = [];
  REG.customers.forEach(c => (c.projects||[]).forEach(p => (p.tools||[]).forEach(t => out.push({c, p, t}))));
  return out;
}
const toolsOf = mod => rows().filter(r => r.t.module === mod);

function route(){
  const id = (location.hash || "#home").slice(1);
  return MODULES.some(m => m.id === id) ? id : "home";
}

function renderNav(){
  const cur = route();
  document.getElementById("nav").innerHTML = MODULES.map(m => {
    const n = m.id === "home" ? "" : toolsOf(m.id).length;
    const tail = m.id === "home" ? "" : (n ? `<span class="cnt">${n}</span>` : `<span class="soon">เร็วๆ นี้</span>`);
    return `<li><a href="#${m.id}" ${m.id===cur?'aria-current="page"':""}><span class="no">${m.no}</span>${esc(m.name)}${tail}</a></li>`;
  }).join("");
  document.getElementById("sideFoot").textContent = REG.updated ? "อัปเดต " + REG.updated : "";
}

function head(eyebrow, title, sub, extra=""){
  return `<div class="page-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1>${sub?`<p>${esc(sub)}</p>`:""}</div>${extra}</div>`;
}

function customerBlocks(list, q){
  const by = new Map();
  list.forEach(r => {
    const hay = [r.c.name, r.c.id, r.p.jo, r.p.name, (r.p.tags||[]).join(" "), r.t.name, r.t.th].join(" ").toLowerCase();
    if (q && !hay.includes(q)) return;
    if (!by.has(r.c.id)) by.set(r.c.id, {c:r.c, projects:new Map()});
    const cc = by.get(r.c.id);
    if (!cc.projects.has(r.p.id)) cc.projects.set(r.p.id, {p:r.p, tools:[]});
    cc.projects.get(r.p.id).tools.push(r.t);
  });
  if (!by.size) return `<div class="empty">${q ? `ไม่พบรายการที่ตรงกับ “${esc(q)}”` : "ยังไม่มีรายการ"}</div>`;
  return [...by.values()].map(({c, projects}) => `
    <section class="customer" aria-label="${esc(c.name)}">
      <div class="c-head"><span class="lvl">L2</span><h3>${esc(c.name)}</h3><span class="meta">${esc(c.site||"")} · ${projects.size} โปรเจค</span></div>
      ${[...projects.values()].map(({p, tools}) => `
      <div class="project">
        <div class="p-info">
          <span class="lvl">L3</span> <span class="jo">JO ${esc(p.jo)}</span>
          <h4>${esc(p.name)}</h4>
          <div class="row">${p.status?`<span class="pill status">${esc(p.status)}</span>`:""}${p.due?`<span class="pill">ส่งมอบ ${esc(p.due)}</span>`:""}${(p.tags||[]).map(t=>`<span class="pill">${esc(t)}</span>`).join("")}</div>
        </div>
        <div class="tools">${tools.map(t => {
          const m = MODULES.find(x => x.id === t.module);
          return `<a class="tool" href="${esc(t.path)}"><span class="t-mod">${esc(m ? m.name : (t.type||"Tool"))}</span><span class="t-name">${esc(t.name)}</span><span class="t-desc">${esc(t.desc||"")}</span></a>`;
        }).join("")}</div>
      </div>`).join("")}
    </section>`).join("");
}

function pageHome(){
  const all = rows();
  const nC = new Set(all.map(r=>r.c.id)).size, nP = new Set(all.map(r=>r.c.id+"/"+r.p.id)).size;
  const stats = `<div class="stats"><div><b>${nC}</b><span>ลูกค้า</span></div><div><b>${nP}</b><span>โปรเจค</span></div><div><b>${all.length}</b><span>เครื่องมือ</span></div></div>`;
  const mods = MODULES.filter(m => m.id !== "home").map(m => {
    const n = toolsOf(m.id).length;
    return `<a class="mod" href="#${m.id}"><span class="m-no">${m.no}</span><span class="m-name">${esc(m.name)}</span><span class="m-desc">${esc(m.th)} — ${esc(m.desc)}</span><span class="m-state ${n?"":"soon"}">${n ? n + " รายการ" : "กำลังพัฒนา"}</span></a>`;
  }).join("");
  return head("L1 · SSM Work", "Home", "รวมเครื่องมือและเอกสารของงานติดตั้งและบริการ แยกตามลูกค้า (L2) และโปรเจค (L3)", stats)
    + `<h2 class="sec">เมนู</h2><div class="modules">${mods}</div>`
    + `<h2 class="sec">ลูกค้าและโปรเจค</h2><input id="q" class="search" type="search" placeholder="ค้นหาลูกค้า, JO, ชื่อโปรเจค หรือเครื่องมือ…" aria-label="ค้นหา"><div id="list" style="display:grid;gap:14px">${customerBlocks(all, "")}</div>`;
}

function pageModule(m){
  const list = toolsOf(m.id);
  if (!list.length){
    return head(m.no + " · " + m.th, m.name, m.desc)
      + `<div class="placeholder"><span class="tag">กำลังพัฒนา</span><h3>ยังไม่มีรายการในเมนูนี้</h3>
         <p class="note" style="margin:0">ขอบเขตที่วางไว้</p><ul>${(m.plan||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
         <p class="note" style="margin:0">เมื่อมีเครื่องมือแล้ว ใส่ <code>"module": "${esc(m.id)}"</code> ให้รายการใน <code>registry.json</code> จะขึ้นในหน้านี้เอง</p></div>`;
  }
  const table = `<div class="tbl"><table><thead><tr><th>ลูกค้า</th><th>JO</th><th>โปรเจค</th><th>รายการ</th><th></th></tr></thead><tbody>${
    list.map(r => `<tr><td>${esc(r.c.name)}</td><td><span class="jo">${esc(r.p.jo)}</span></td><td>${esc(r.p.name)}</td><td>${esc(r.t.name)}<div class="note">${esc(r.t.desc||"")}</div></td><td><a class="open" href="${esc(r.t.path)}">เปิด →</a></td></tr>`).join("")
  }</tbody></table></div>`;
  return head(m.no + " · " + m.th, m.name, m.desc, `<div class="stats"><div><b>${list.length}</b><span>รายการ</span></div></div>`)
    + table
    + ((m.plan||[]).length ? `<div class="placeholder"><span class="tag">แผนพัฒนาเมนูนี้</span><ul>${m.plan.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>` : "");
}

function render(){
  const id = route();
  const m = MODULES.find(x => x.id === id);
  document.title = id === "home" ? "SSM Work" : m.name + " · SSM Work";
  document.getElementById("content").innerHTML = id === "home" ? pageHome() : pageModule(m);
  renderNav();
  const q = document.getElementById("q");
  if (q) q.addEventListener("input", () => { document.getElementById("list").innerHTML = customerBlocks(rows(), q.value.trim().toLowerCase()); });
  document.getElementById("shell").classList.remove("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded","false");
}

window.addEventListener("hashchange", () => { render(); document.getElementById("content").focus({preventScroll:true}); window.scrollTo(0,0); });
document.getElementById("menuBtn").addEventListener("click", e => {
  const sh = document.getElementById("shell"); const open = !sh.classList.contains("open");
  sh.classList.toggle("open", open); e.currentTarget.setAttribute("aria-expanded", String(open));
});
document.querySelector(".main").addEventListener("click", e => { const sh=document.getElementById("shell"); if (sh.classList.contains("open") && !e.target.closest("#menuBtn")) { sh.classList.remove("open"); document.getElementById("menuBtn").setAttribute("aria-expanded","false"); } });
render();
fetch("registry.json", {cache:"no-store"})
  .then(r => r.json())
  .then(d => { REG = d; render(); })
  .catch(() => { document.getElementById("content").insertAdjacentHTML("afterbegin", `<div class="empty">โหลดรายการไม่สำเร็จ — ลองรีเฟรชหน้า</div>`); });
</script>
</body>
</html>
